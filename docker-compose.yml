# ── MediAssist — Docker Compose ────────────────────────────────────────────────
# Starts MediAssist API + Ollama together.
# Usage: docker-compose up --build

version: "3.9"

services:


  # ── Ollama — Local LLM Server ───────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: mediassist-ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ollama_data:/root/.ollama
    # Simply serve the model locally without checking for network updates on every boot
    entrypoint: ["ollama", "serve"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  # ── MediAssist API ──────────────────────────────────────────────────────────
  mediassist:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediassist-api
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      CHROMA_PERSIST_DIR: /app/vector_store
      CHROMA_COLLECTION: healthcare_docs
      DATA_DIR: /app/data
      CHUNK_SIZE: "600"
      CHUNK_OVERLAP: "100"
      TOP_K_RESULTS: "5"
      SIMILARITY_THRESHOLD: "0.70"
      NUM_PREDICT: "250"
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      LOG_LEVEL: INFO
    volumes:
      - vector_store_data:/app/vector_store
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  ollama_data:
    driver: local
  vector_store_data:
    driver: local
